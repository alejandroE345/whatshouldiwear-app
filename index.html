<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Should I Wear - Streetwear Under $100</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">WHAT SHOULD I WEAR?</h1>
            <h2 id="welcome">Welcome!</h2>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="filters">
                <h2 class="section-title">FIND YOUR VIBE</h2>
                <div class="filter-grid">
                    <button class="filter-btn-active" id="all-looks">ALL LOOKS</button>
                    <button class="filter-btn-active" id="casual">CASUAL</button>
                    <button class="filter-btn-active" id="street">STREET</button>
                    <button class="filter-btn-active" id="y2k">Y2K</button>
                </div>
                <div class="brand-filters">
                    <h5>BRANDS</h5>
                    <button class="brand-btn active">VANS</button>
                    <button class="brand-btn">DC SHOE CO.</button>
                    <button class="brand-btn">LEVI'S</button>
                </div>
            </section>

            <section class="outfit-showcase">
                <div class="outfit-card casual">
                    <div class="outfit-info">
                        <h3 class="outfit-title">URBAN ESSENTIALS</h3>
                        <p class="outfit-desc">Basic Baggy Jeans</p>
                        <img src="jeans.png">
                        <button class="shop-btn">GET THIS LOOK</button>
                    </div>
                </div>

                <div class="outfit-grid">
                    <div class="outfit-card street">
                        <div class="outfit-image">
                            <div class="price-tag">$64</div>
                        </div>
                        <br>
                        <h4 class="outfit-name">BLAST FROM THE PAST</h4>
                    </div>
                    <div class="outfit-card y2k">
                        <div class="outfit-image">
                            <img src="BabelTalkBlackWebFront.webp">
                            <div class="price-tag">$62</div>
                        </div>
                        <button class="shop-btn small">SHOP NOW</button>
                    </div>
                    <br>

                    <div class="outfit-card y2k">
                        <div class="outfit-image">
                            <img src="hoodie.avif">
                            <div class="price-tag">$78</div>
                        </div>
                        <h4 class="outfit-name">RETRO VIBES</h4>
                        <button class="shop-btn small">SHOP NOW</button>
                    </div>
                    <br>
                </div>
            </section>

            <section class="item-breakdown">
                <h2 class="section-title">FEATURED PIECES</h2>
                <div class="items-grid">
                    <div class="item-card">
                        <div class="item-image">HOODIES</div>
                        <div class="item-info">
                            <h5>Oversized Hoodie</h5>
                            <p class="brand">LEVI'S</p>
                            <img src="levis.jpg">
                            <span class="price">$29</span>
                        </div>
                    </div>
                    <div class="item-card">
                        <div class="item-image">HATS</div>
                        <div class="item-info">
                            <h5>ON SALE!</h5>
                            <p class="brand">DC</p>
                            <img src="hat.webp">
                            <span class="price">$25</span>
                        </div>
                    </div>
                    <div class="item-card">
                        <div class="item-image">SHOES</div>
                        <div class="item-info">
                            <h5>Knu Skool Shoes</h5>
                            <p class="brand">VANS</p>
                            <img src="vans.webp">
                            <span class="price">$59.99</span>
                            <a href="product-details.html">View Details</a>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
